<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Hyper Notepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body class="bg-gray-50 text-gray-900 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100">

    <div class="flex h-screen overflow-hidden">
        <div id="mobile-overlay" class="fixed inset-0 bg-black/40 z-30 hidden md:hidden"></div>
        <!-- Sidebar -->
        <aside id="dashboard-sidebar"
            class="w-64 bg-white border-r border-gray-200 flex flex-col fixed inset-y-0 left-0 z-40 transform -translate-x-full transition-transform duration-200 md:relative md:translate-x-0 dark:bg-gray-800 dark:border-gray-700">
            <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-gray-700">
                <span class="text-xl font-bold text-blue-600 dark:text-blue-400">Hyper Notepad</span>
            </div>

            <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                <a href="#" data-view="notes"
                    class="dashboard-nav-link flex items-center px-4 py-2 text-gray-700 bg-gray-100 rounded-md dark:bg-gray-700 dark:text-white group">
                    <svg class="w-5 h-5 mr-3 text-gray-500 group-hover:text-blue-500 dark:text-gray-400" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                        </path>
                    </svg>
                    My Notes
                </a>
                <a href="#" data-view="settings"
                    class="dashboard-nav-link flex items-center px-4 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-md dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white group">
                    <svg class="w-5 h-5 mr-3 text-gray-400 group-hover:text-blue-500 dark:text-gray-400" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    Settings
                </a>
            </nav>

            <div class="p-4 border-t border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between">
                    <!-- Dark Mode Toggle -->
                    <button id="theme-toggle"
                        class="p-2 text-gray-500 rounded hover:bg-gray-100 hover:text-gray-900 focus:outline-none dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                            </path>
                        </svg>
                    </button>
                    <button id="logout-btn"
                        class="text-sm font-medium text-red-600 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300">Logout</button>
                </div>
                <div class="mt-4 flex items-center">
                    <div class="flex-shrink-0">
                        <div
                            class="h-8 w-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">
                            U</div>
                    </div>
                    <div class="ml-3">
                        <p id="user-greeting" class="text-sm font-medium text-gray-700 dark:text-gray-200">User</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col h-screen overflow-hidden">
            <!-- Mobile Header -->
            <header
                class="md:hidden flex items-center justify-between p-4 bg-white border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700">
                <span class="text-lg font-bold text-blue-600 dark:text-blue-400">Hyper Notepad</span>
                <button id="mobile-menu-btn" class="text-gray-500 focus:outline-none dark:text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </header>

            <main class="flex-1 overflow-y-auto p-8 bg-gray-50 dark:bg-gray-900">
                <div class="max-w-7xl mx-auto">
                    <!-- Action Bar -->
                    <div class="flex justify-between items-center mb-8">
                        <h1 id="dashboard-view-title" class="text-3xl font-bold text-gray-900 dark:text-white">My Notes</h1>
                        <div id="notes-actions" class="flex items-center space-x-3">
                            <input type="file" id="file-upload" class="hidden" accept=".txt,.pdf">
                            <button id="import-btn" type="button"
                                class="flex items-center px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none dark:bg-gray-800 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                                </svg>
                                Import
                            </button>
                            <button id="new-note-btn"
                                class="flex items-center px-4 py-2 bg-blue-600 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white hover:bg-blue-700 focus:outline-none">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4"></path>
                                </svg>
                                New Note
                            </button>
                        </div>
                    </div>

                    <div id="notes-search-wrap" class="mb-6">
                        <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
                            <div>
                                <h2 class="text-3xl font-bold text-gray-900 dark:text-white">My Saved Notes</h2>
                                <div class="mt-3 flex flex-wrap items-center gap-4 text-lg">
                                    <button id="sort-title-btn" type="button"
                                        class="text-blue-700 dark:text-blue-400 font-semibold hover:text-blue-800 dark:hover:text-blue-300">
                                        &#8597; Sort by Title
                                    </button>
                                    <button id="sort-updated-btn" type="button"
                                        class="text-blue-700 dark:text-blue-400 font-semibold hover:text-blue-800 dark:hover:text-blue-300">
                                        &#8645; Sort by Updated
                                    </button>
                                </div>
                            </div>

                            <input id="note-search" type="text" placeholder="Search notes..."
                                class="w-full md:w-72 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:placeholder-gray-500">
                        </div>
                    </div>

                    <div id="view-notes">
                        <!-- Notes Grid -->
                        <div id="notes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <!-- Notes will be injected here -->
                        </div>
                    </div>

                    <div id="view-settings" class="hidden">
                        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 max-w-2xl">
                            <h2 class="text-xl font-bold mb-4">Settings</h2>
                            <div class="space-y-4">
                                <div class="flex items-center justify-between">
                                    <span class="text-gray-600 dark:text-gray-300">Signed in as</span>
                                    <span id="settings-username" class="font-semibold"></span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="text-gray-600 dark:text-gray-300">Theme preference</span>
                                    <button id="settings-theme-toggle" type="button" class="px-3 py-1.5 rounded-md bg-blue-600 text-white hover:bg-blue-700 text-sm">Toggle theme</button>
                                </div>
                                <div class="pt-2">
                                    <button id="settings-logout-btn" type="button" class="text-sm font-medium text-red-600 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300">Logout</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="language.js"></script>
    <script src="theme.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
